<svg xmlns="http://www.w3.org/2000/svg" width="650" height="220" viewBox="0 0 650 220">
  <style>
    text { font-family: 'Source Code Pro', 'Fira Code', 'Courier New', monospace; }
  </style>

  <rect x="10" y="10" rx="6" ry="6" width="630" height="200" fill="#1a1b27" stroke="#70a5fd" stroke-width="1.5" opacity="0.95"/>

  <text x="30" y="45" font-size="13" fill="#38bdae" font-weight="700" style="opacity:0">
    [ SYSTEM BOOT ] v2.0.25
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0s" fill="freeze"/>
  </text>

  <line x1="30" y1="55" x2="620" y2="55" stroke="#70a5fd" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.3" dur="0.5s" begin="0.8s" fill="freeze"/>
  </line>

  <text x="30" y="80" font-size="12" fill="#70a5fd" style="opacity:0">
    <tspan fill="#38bdae">$</tspan> Cristiano Xavier
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </text>

  <text x="30" y="102" font-size="12" fill="#bf91f3" style="opacity:0">
    <tspan fill="#38bdae">$</tspan> Junior Software Developer
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
  </text>

  <text x="30" y="124" font-size="12" fill="#bf91f3" style="opacity:0">
    <tspan fill="#38bdae">$</tspan> Java | TypeScript | Web Technologies
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
  </text>

  <line x1="30" y1="138" x2="620" y2="138" stroke="#70a5fd" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.3" dur="0.5s" begin="3.0s" fill="freeze"/>
  </line>

  <text x="30" y="163" font-size="12" fill="#38bdae" style="opacity:0">
    <tspan fill="#70a5fd">"</tspan>Building web applications and APIs<tspan fill="#70a5fd">"</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.4s" fill="freeze"/>
  </text>

  <text x="30" y="193" font-size="12" fill="#70a5fd" style="opacity:0">
    _
    <animate attributeName="opacity" from="0" to="0.6" dur="0.3s" begin="4.0s" fill="freeze"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1s" begin="4.0s" repeatCount="indefinite"/>
  </text>
</svg>
