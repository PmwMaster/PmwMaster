name: Daily Activity

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "$(date '+%Y-%m-%d %H:%M') - daily activity" >> activity.md

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add activity.md
          git diff --staged --quiet || git commit -m "Daily activity"
          git push
