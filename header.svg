<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220">
  <style>
    text { font-family: 'Source Code Pro', 'Fira Code', 'Courier New', monospace; }
  </style>

  <text x="320" y="35" font-size="13" fill="#38bdae" font-weight="bold" text-anchor="middle" opacity="0">
    [ SYSTEM BOOT ] v2.0.25
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze"/>
  </text>

  <text x="320" y="65" font-size="12" fill="#70a5fd" text-anchor="middle" opacity="0">
    <tspan fill="#38bdae">$</tspan> Cristiano Xavier
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
  </text>

  <text x="320" y="87" font-size="12" fill="#bf91f3" text-anchor="middle" opacity="0">
    <tspan fill="#38bdae">$</tspan> Junior Software Developer
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
  </text>

  <text x="320" y="109" font-size="12" fill="#bf91f3" text-anchor="middle" opacity="0">
    <tspan fill="#38bdae">$</tspan> Java | TypeScript | Web Technologies
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>
  </text>

  <text x="320" y="145" font-size="12" fill="#38bdae" text-anchor="middle" opacity="0">
    <tspan fill="#70a5fd">"</tspan>Building web applications and APIs<tspan fill="#70a5fd">"</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>
  </text>

  <text x="320" y="180" font-size="14" fill="#70a5fd" text-anchor="middle" opacity="0">
    _
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="3.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="3.0s" repeatCount="indefinite"/>
  </text>
</svg>
